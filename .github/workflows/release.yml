name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'CMakeLists.txt'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $cmakeText = Get-Content ./CMakeLists.txt -Raw
          if ($cmakeText -notmatch 'project\(AudioRoleSync VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not determine the project version from CMakeLists.txt.'
          }

          $tag = "v$($Matches[1])"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $tag."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists -and $env:GITHUB_REF_TYPE -eq 'branch') {
            Write-Host "Release $env:TAG already exists. Skipping publication from main."
            exit 0
          }

          $assets = @(Get-ChildItem -Path ./dist -File | Where-Object {
            $_.Name -like '*-portable.zip' -or $_.Name -like '*-setup.exe'
          } | Select-Object -ExpandProperty FullName)

          if ($assets.Count -ne 2) {
            throw "Expected 2 release assets, found $($assets.Count)."
          }

          if (-not $releaseExists) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title "AudioRoleSync $env:TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create GitHub Release.' }
          }

          gh release upload $env:TAG $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
