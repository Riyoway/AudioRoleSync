name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not (gh release view $env:TAG 2>$null)) {
            gh release create $env:TAG --title "AudioRoleSync $env:TAG" --generate-notes
          }
          $assets = @(
            Get-ChildItem ./dist/*-portable.zip,
            Get-ChildItem ./dist/*-setup.exe
          ) | ForEach-Object { $_.FullName }
          gh release upload $env:TAG $assets --clobber
