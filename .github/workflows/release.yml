name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not (gh release view $env:TAG 2>$null)) {
            gh release create $env:TAG --title "AudioRoleSync $env:TAG" --generate-notes
          }

          $assets = Get-ChildItem -Path ./dist -File | Where-Object {
            $_.Name -like '*-portable.zip' -or $_.Name -like '*-setup.exe'
          } | Select-Object -ExpandProperty FullName

          if ($assets.Count -ne 2) {
            throw "Expected 2 release assets, found $($assets.Count)."
          }

          gh release upload $env:TAG $assets --clobber
